# Local development stack.
# Phase 0: PostgreSQL only. The api and client services are added in Phase 16.
# All credentials come from .env (gitignored) — nothing is hardcoded here.

services:
  db:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5433 avoids clashing with any natively installed PostgreSQL on 5432.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets dependent services wait for readiness rather than sleeping a fixed time.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only database browser. The PostgreSQL counterpart to
  # phpMyAdmin, which only speaks MySQL and cannot connect to this database.
  #
  # Bound to 127.0.0.1 so it is reachable from this machine only. It must never
  # be exposed in a real deployment: it offers unauthenticated access to
  # whoever can reach the port, and grants full SQL over the database.
  adminer:
    image: adminer:4-standalone
    container_name: ems-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
