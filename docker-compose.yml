# Local development stack.
# Phase 0: PostgreSQL only. The api and client services are added in Phase 16.
# All credentials come from .env (gitignored) — nothing is hardcoded here.

services:
  db:
    image: postgres:16-alpine
    container_name: ems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5433 avoids clashing with any natively installed PostgreSQL on 5432.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets dependent services wait for readiness rather than sleeping a fixed time.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
